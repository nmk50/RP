[core]
# HeavyHoverTank.java:33-35, 63-75; UnitTypeEnum.java:854-886
name : heavyHoverTank
displayText : Heavy Hover Tank
price : 1000
maxHp : 450
mass : 3000
radius : 11
displayRadius : 13
techLevel : 2
buildSpeed : 0.001

[graphics]
# R.drawable.heavy_hover_tank* (:37-43). The hull is 24x36 and its barrel points north in the sheet,
# which is why getRenderRotation:204-206 hands the renderer movementLevels[0].targetX + 90 instead of
# the hull's own rotationSpeed: the sprite follows the *turret's* aim, so the tank keeps its gun on the
# target while sliding sideways. CustomUnit spells the same thing
# lock_body_rotation_with_main_turret, so the flag goes here rather than a special case in the renderer.
# (BaseUnit.getRenderRotation:1002 is the default the other hover tank keeps -- rotationSpeed + 90.)
total_frames : 1
image : heavy_hover_tank.png
image_wreak : heavy_hover_tank_dead.png
image_shadow : heavy_hover_tank_shadow.png
lock_body_rotation_with_main_turret : true

[movement]
# HoverLandUnit + HeavyHoverTank.java:152-183, :95-99, :191-200.
movementType : HOVER
moveSpeed : 0.7
moveAccelerationSpeed : 0.06
moveDecelerationSpeed : 0.09
# Source 20.0f is degrees; RP converts maxTurnSpeed with 0.0174533 (Game.cpp:1904).
maxTurnSpeed : 20
# HeavyHoverTank does not override OrderableUnit.B():4610, which answers -1 -- "no turn ramp", the hull
# snaps straight to maxTurnSpeed. A positive value would be that unit's B() override (HoverTankUnit:226
# is 0.5, which is why hovertank.ini carries 0.5 here).
turnAcceleration : -1
moveSlidingMode : true
targetHeight : 4
targetHeightDrift : 1.5

[attack]
# m():141-143, b():146-148, canAttackFlyingUnits():220-224.
canAttack : true
canAttackFlyingUnits : true
canAttackLandUnits : true
canAttackUnderwaterUnits : false
maxAttackRange : 160
shootDelay : 75
# g(int):226-229 = 16 is the muzzle distance along the aim, and [attack] turretSize is where
# OrderableUnit.g() would default from -- it is not the hull radius (11). ExperimentalHoverTank has the
# same field and the same mistake behind it (its g() is 8, not its radius).
turretSize : 16

[projectile_1]
# a(BaseUnit,int):108-133: U=q(i)=40 (:103-105), t=1, r=7, s=0.2, h=95, P=7, x=1,
# ar=a(255,230,0,50) -> RP 0xRRGGBBAA via #AARRGGBB.
directDamage : 40
speed : 1
targetSpeed : 7
targetSpeedAcceleration : 0.2
life : 95
frame : 7
drawType : 0
drawSize : 1
color : #FFE60032
turnSpeed : -1

[turret_1]
# d(int):58-61 has no turret sprite; c(int):186-188 = 2.4 is the turret turn speed.
# g(int):226-229 = 16 is the muzzle offset, so `size` repeats [attack] turretSize rather than the radius.
x : 0
y : 0
size : 16
turnSpeed : 2.4
invisible : true
canAttackFlyingUnits : true
canAttackLandUnits : true
canAttackUnderwaterUnits : false
projectile : 1
delay : 75
