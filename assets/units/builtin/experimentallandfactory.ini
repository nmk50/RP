canBuild_1_pos : 1
canBuild_1_tech : 1
canBuild_2_name : experimentalHoverTank
canBuild_2_pos : 2
canBuild_2_tech : 1
# cm():203-206 returns NONE_ACTION_ID: the 1500-credit upgrade action is never offered.

