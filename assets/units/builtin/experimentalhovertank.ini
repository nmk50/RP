# ExperimentalHoverTank.java:362 -- getTechLevel() returns 1, and GameViewUtils.a(OrderableUnit):154-158
# only walks `i < getTechLevel()`, so this hull has exactly ONE barrel even though d(i):103 answers for
# any index. G(i):355 also pins its pivot to (posX, posY), i.e. the hull centre with no x/y offset, and
# g(i):350 puts the muzzle 8 px down the barrel (c(i):285 is the 1.5 deg/tick turret turn). Three
# turrets at y -8/0/+8 stacked the same sprite three times and read as three main guns.
[turret_1]
x : 0
y : 0
size : 8
turnSpeed : 1.5
canAttackFlyingUnits : true
canAttackLandUnits : true
canAttackUnderwaterUnits : false
projectile : 1
delay : 8
