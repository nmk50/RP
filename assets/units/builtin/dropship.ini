[core]
name : dropship
displayText : Dropship
price : 800
maxHp : 500
mass : 16000
radius : 20
displayRadius : 20
techLevel : 1
buildSpeed : 0.001
maxTransportingUnits : 4

[graphics]
total_frames : 1
image : dropship.png
image_wreak : dropship_dead.png
image_shadow : dropship_shadow.png

[movement]
# Dropship.java:278-284 is the only air hull in RWX that touches its own height: with no waypoint left and
# not over liquid it settles to posZ 2, otherwise it cruises at 35 +- a 1.5 px sine. The 2.0 landing is
# what [movement] landOnGround describes for an ini hull, so the data says it and the shared AIR height
# pass (Game.cpp updateHeight) does the rest -- including the take-off, which is just the else branch.
# heightChangeRate 0.35 is the cruise rate at :283; landing at :281 is 0.4, and RP has one key for both.
movementType : AIR
moveSpeed : 2.3
moveAccelerationSpeed : 0.03
moveDecelerationSpeed : 0.05
maxTurnSpeed : 1.4
turnAcceleration : 0.2
targetHeight : 35
targetHeightDrift : 1.5
heightChangeRate : 0.35
landOnGround : true

[attack]
canAttack : false
canAttackFlyingUnits : false
canAttackLandUnits : true
canAttackUnderwaterUnits : false
maxAttackRange : 0
shootDelay : 50
turretSize : 1
